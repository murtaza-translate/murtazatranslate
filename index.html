<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b7a">

<title>Murtaza Translate</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f4f8;
  color:#222;
}

header{
  background:#173b7a;
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  font-size:15px;
}

main{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #ddd;
}

h2{
  margin-top:0;
  color:#173b7a;
}

select,
textarea,
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
}

select,
textarea{
  border:1px solid #ccd3dd;
  background:white;
}

textarea{
  height:180px;
  margin-top:10px;
  resize:vertical;
}

button{
  border:0;
  margin-top:10px;
  background:#0d6efd;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

.gray{
  background:#e9eef7;
  color:#173b7a;
}

.green{
  background:#198754;
}

#result{
  background:#f5f8fc;
  min-height:120px;
  padding:15px;
  border-radius:12px;
  font-size:18px;
  line-height:1.7;
  white-space:pre-wrap;
  word-wrap:break-word;
}

#count{
  color:#666;
  font-weight:bold;
  margin-top:8px;
}

#loading{
  text-align:center;
  color:#173b7a;
  font-weight:bold;
  padding:10px;
  display:none;
}

#status{
  text-align:center;
  margin-top:8px;
  color:#666;
  font-size:14px;
}

@media(max-width:600px){
  .row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <h1>Murtaza Translate</h1>
  <p>English • اردو • हिंदी</p>
</header>

<main>

  <!-- LANGUAGE -->
  <div class="card">

    <h2>Language</h2>

    <div class="row">

      <select id="from">
        <option value="en">English</option>
        <option value="ur">Urdu</option>
        <option value="hi">Hindi</option>
      </select>

      <button type="button" onclick="swapLanguages()">
        ⇄ Swap
      </button>

      <select id="to">
        <option value="ur">Urdu</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
      </select>

    </div>

  </div>


  <!-- TRANSLATOR -->
  <div class="card">

    <h2>Translator</h2>

    <textarea
      id="input"
      placeholder="Type or paste your text here..."
    ></textarea>

    <div id="count">
      Words: 0 | Characters: 0
    </div>

    <div class="row">

      <button
        type="button"
        class="gray"
        onclick="clearText()"
      >
        Clear
      </button>

      <button
        type="button"
        class="gray"
        onclick="copyInput()"
      >
        Copy Text
      </button>

    </div>

    <button
      id="translateBtn"
      type="button"
      onclick="translateText()"
    >
      Translate
    </button>

    <div id="loading">
      Translating...
    </div>

    <div id="status"></div>

    <h2 style="margin-top:20px">
      Translation Result
    </h2>

    <div id="result">
      Your translation will appear here.
    </div>

    <button
      type="button"
      class="green"
      onclick="copyResult()"
    >
      Copy Translation
    </button>

  </div>

</main>

const statusBox = document.getElementById("status");
const translateBtn = document.getElementById("translateBtn");
