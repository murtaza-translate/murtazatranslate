<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murtaza Translate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Header Styles */
        header {
            background-color: #1a365d;
            width: 100%;
            text-align: center;
            padding: 20px 15px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Style */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card-title {
            color: #1a365d;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Language Selector */
        .lang-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fff;
            color: #2d3748;
            outline: none;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .lang-select:focus {
            border-color: #3b82f6;
        }

        /* Swap Button */
        .swap-btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px 0;
        }

        .swap-btn:hover {
            background-color: #1d4ed8;
        }

        /* Textarea */
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            outline: none;
            color: #2d3748;
        }

        textarea:focus {
            border-color: #3b82f6;
        }

        /* Info Text */
        .info-text {
            font-size: 14px;
            color: #718096;
            margin: 10px 0;
            font-weight: 600;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: #e2e8f0;
            color: #2d3748;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Result Box */
        .result-box {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            min-height: 80px;
            font-size: 18px;
            color: #2d3748;
            word-wrap: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            color: #2563eb;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Murtaza Translate</h1>
        <p>English • اردو • हिंदी</p>
    </header>

    <div class="container">
        <!-- Language Card -->
        <div class="card">
            <div class="card-title">Language</div>
            
            <label>From:</label>
            <select id="sourceLang" class="lang-select">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="hi">Hindi</option>
            </select>

            <button class="swap-btn" onclick="swapLanguages()">⇄ Swap</button>

            <label>To:</label>
            <select id="targetLang" class="lang-select">
                <option value="ur">Urdu</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>
        </div>

        <!-- Translator Card -->
        <div class="card">
            <div class="card-title">Translator</div>
            
            <textarea id="inputText" placeholder="یہاں ٹیکسٹ لکھیں...">Assalamu alaikum sir my name is ghulam Murtaza</textarea>
            
            <div class="info-text">
                Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span>
            </div>

            <div class="btn-group">
                <button class="btn-secondary" onclick="clearText()">Clear</button>
                <button class="btn-secondary" onclick="copyText()">Copy Text</button>
                <button class="btn-primary" onclick="translateText()">Translate</button>
            </div>
            
            <div id="loading" class="loading">Translating... Please wait.</div>
        </div>

        <!-- Result Card -->
        <div class="card">
            <div class="card-title">Translation Result</div>
            <div class="result-box" id="resultBox">
                Your translation will appear here
            </div>
        </div>
    </div>

    <script>
        // Elements کو سلیکٹ کرنا
        const inputText = document.getElementById('inputText');
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const resultBox = document.getElementById('resultBox');
        const wordCountSpan = document.getElementById('wordCount');
        const charCountSpan = document.getElementById('charCount');
        const loadingDiv = document.getElementById('loading');

        // 1. Words اور Characters گننے کا فنکشن
        function updateCounts() {
            const text = inputText.value;
            const chars = text.length;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            
            charCountSpan.textContent = chars;
            wordCountSpan.textContent = words;
        }

        inputText.addEventListener('input', updateCounts);
        updateCounts();

        // 2. زبانیں بدلنے کا فنکشن (Swap)
        function swapLanguages() {
            const temp = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = temp;
            
            if (resultBox.textContent !== "Your translation will appear here" && resultBox.textContent !== "") {
                inputText.value = resultBox.textContent;
                resultBox.textContent = "Your translation will appear here";
                updateCounts();
            }
        }

        // 3. ٹیکسٹ صاف کرنے کا فنکشن (Clear)
        function clearText() {
            inputText.value = '';
            resultBox.textContent = 'Your translation will appear here';
            updateCounts();
        }

        // 4. ٹیکسٹ کاپی کرنے کا فنکشن (Copy)
        function copyText() {
            if (resultBox.textContent === "Your translation will appear here" || resultBox.textContent === "") {
                alert("پہلے ترجمہ کریں، پھر کاپی کریں۔");
                return;
            }
            navigator.clipboard.writeText(resultBox.textContent).then(() => {
                alert("ترجمہ کاپی ہو گیا!");
            }).catch(err => {
                alert("کاپی کرنے میں مسئلہ ہوا۔");
            });
        }

        // 5. مرکزی ترجمہ کرنے کا فنکشن (Better API for GitHub Pages)
        async function translateText() {
            const text = inputText.value.trim();
            const from = sourceLang.value;
            const to = targetLang.value;

            if (text === '') {
                alert("براہ کرم ترجمہ کرنے کے لیے کچھ ٹیکسٹ لکھیں۔");
                return;
            }

            loadingDiv.style.display = 'block';
            resultBox.textContent = '...';

            // GitHub Pages کے لیے زیادہ مستحکم API
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // API سے آنے والے ڈیٹا کو چیک کرنا
                if (data && data.responseData && data.responseData.translatedText) {
                    resultBox.textContent = data.responseData.translatedText;
                } else {
                    resultBox.textContent = "Translation failed. Please try again.";
                }

            } catch (error) {
                console.error("Translation Error:", error);
                resultBox.textContent = "Error: Internet connection check karein.";
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        // Enter کی دبانے پر ترجمہ کرنا
        inputText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                translateText();
            }
        });
    </script>
</body>
</html>
